# Direct (raw-scale) estimators of E[SI | x] on top of the final tier.
# Since data release 2 the target is 0 for inactive compounds and heavy tailed otherwise, so models of the raw value (also with Tweedie
# objectives: a point mass at zero + a positive heavy tail) can compete with the two-part model  (1 - p) * M(x).
#   python -m vacv_si cv -c configs/exp/tail.yaml --tasks rawns raw        # only the raw-scale tasks (clf/reg are the final tier's)
#   python -m vacv_si ensemble -c configs/exp/tail.yaml --no-submit        # blends them with the stored final-tier models
extends: final.yaml
tag: tail

ensemble:
  include_tags: [final]
  use_raw_models: true
  raw_top_k: 3

models:
  rawns:                       # raw SI of the active compounds (E[SI | x, active] directly)
    et_all:      {type: extra_trees, blocks: [morgan2c, desc, "@meta", "@style"], params: {n_estimators: 800, min_samples_leaf: 3, max_features: 0.2, n_jobs: 1}}
    et_ap:       {type: extra_trees, blocks: [apc, desc, "@meta", "@style"], params: {n_estimators: 800, min_samples_leaf: 3, max_features: 0.2, n_jobs: 1}}
    et_knn:      {type: extra_trees, blocks: [desc, "@meta", "@style"], knn: {kernels: [k_m2, k_ap], ks: [1, 3, 8]}, params: {n_estimators: 800, min_samples_leaf: 3, max_features: 0.3, n_jobs: 1}}
    et_knn_cap:  {type: extra_trees, blocks: [desc, "@meta", "@style"], knn: {kernels: [k_m2, k_ap], ks: [1, 3, 8]}, y_cap: 5000, params: {n_estimators: 800, min_samples_leaf: 3, max_features: 0.3, n_jobs: 1}}
    cat_all:     {type: catboost, blocks: [desc, maccs, "@meta_n", "@style_n"], cat_cols: ["@meta", "@style"], params: {iterations: 400, depth: 4, learning_rate: 0.05, l2_leaf_reg: 10}}
    cat_all_cap: {type: catboost, blocks: [desc, maccs, "@meta_n", "@style_n"], cat_cols: ["@meta", "@style"], y_cap: 5000, params: {iterations: 400, depth: 4, learning_rate: 0.05, l2_leaf_reg: 10}}
    lgbm_gamma:  {type: lightgbm, blocks: [desc, maccs, "@meta", "@style"], params: {objective: gamma, n_estimators: 300, learning_rate: 0.03, num_leaves: 6, min_child_samples: 5, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.3, reg_lambda: 10.0}}
  raw:                         # raw SI / 1e4 of every compound (the competition target itself)
    et_all:      {type: extra_trees, blocks: [morgan2c, desc, "@meta", "@style"], params: {n_estimators: 800, min_samples_leaf: 2, max_features: 0.2, n_jobs: 1}}
    et_ap:       {type: extra_trees, blocks: [apc, desc, "@meta", "@style"], params: {n_estimators: 800, min_samples_leaf: 2, max_features: 0.2, n_jobs: 1}}
    et_meta:     {type: extra_trees, blocks: ["@meta", "@style"], params: {n_estimators: 500, min_samples_leaf: 2, max_features: 0.3, n_jobs: 1}}
    et_knn:      {type: extra_trees, blocks: [desc, "@meta", "@style"], knn: {kernels: [k_m2, k_ap], ks: [1, 3, 8]}, params: {n_estimators: 800, min_samples_leaf: 2, max_features: 0.3, n_jobs: 1}}
    cat_all:     {type: catboost, blocks: [desc, maccs, "@meta_n", "@style_n"], cat_cols: ["@meta", "@style"], params: {iterations: 400, depth: 4, learning_rate: 0.05, l2_leaf_reg: 10}}
    cat_tw15:    {type: catboost, blocks: [desc, maccs, "@meta_n", "@style_n"], cat_cols: ["@meta", "@style"], params: {loss_function: "Tweedie:variance_power=1.5", iterations: 400, depth: 4, learning_rate: 0.05, l2_leaf_reg: 10}}
    lgbm_tw15:   {type: lightgbm, blocks: [desc, maccs, "@meta", "@style"], params: {objective: tweedie, tweedie_variance_power: 1.5, n_estimators: 300, learning_rate: 0.03, num_leaves: 6, min_child_samples: 5, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.3, reg_lambda: 10.0}}
    xgb_tw15:    {type: xgboost, blocks: [desc, maccs, "@meta", "@style"], params: {objective: "reg:tweedie", tweedie_variance_power: 1.5, n_estimators: 300, max_depth: 3, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.3, min_child_weight: 2, reg_lambda: 10.0}}
