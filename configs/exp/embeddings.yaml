extends: final.yaml
tag: emb

# OPT-IN: adds pretrained chemical-language-model embeddings (computed on a GPU with scripts/colab_embeddings.py) as one more
# molecular view. Requires data/embeddings/chemberta77m.npz. Run:  python -m vacv_si cv -c configs/exp/embeddings.yaml
features:
  blocks:
    chemberta: {type: npz_embedding, path: data/embeddings/chemberta77m.npz, pca: 32}
models:
  clf:
    et_emb:     {type: extra_trees, blocks: [chemberta, desc, "@meta", "@style"], params: {n_estimators: 800, min_samples_leaf: 1, max_features: 0.2, n_jobs: 1}}
    et_emb_knn: {type: extra_trees, blocks: [chemberta, desc, "@meta", "@style"], knn: {kernels: [k_m2, k_ap], ks: [1, 3, 8]}, params: {n_estimators: 800, min_samples_leaf: 1, max_features: 0.2, n_jobs: 1}}
  reg:
    cat_emb:    {type: catboost, blocks: [chemberta, desc, "@meta_n", "@style_n"], cat_cols: ["@meta", "@style"], params: {iterations: 500, depth: 5, learning_rate: 0.05, l2_leaf_reg: 5}}
